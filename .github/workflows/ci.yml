name: Verify WarrantyHub
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: warrantyhub_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B verify
      - run: ./mvnw -B test
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/warrantyhub_test
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-only-password
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
