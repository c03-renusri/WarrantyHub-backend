server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:warrantyhub}}
spring.datasource.username=${DB_USER:${MYSQLUSER:warrantyhub}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt-secret=${JWT_SECRET}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never
server.shutdown=graceful
